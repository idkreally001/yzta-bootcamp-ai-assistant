[options]
addons_path = /usr/lib/python3/dist-packages/odoo/addons,/mnt/extra-addons
data_dir    = /var/lib/odoo

; Database
db_host     = odoo-db-bootcamp-ai
db_port     = 5432
db_user     = odoo
db_password = odoo_db_pass
db_name     = False
db_filter   = (?!postgres$).*
list_db     = True

; Performance (single-worker dev mode by default)
workers     = 0
limit_time_cpu    = 600
limit_time_real   = 1200
limit_memory_soft = 2147483648
limit_memory_hard = 2684354560

; Logging
log_level   = info
logfile     = False

; Dev / debug — uncomment to enable
; dev_mode  = all
